<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Claude Code 中文速查表，面向中文开发者整理的快捷键、命令、配置、工作流与 CLI 参数参考。">
  <title>Claude Code 中文速查表</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⌨️</text></svg>">
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <a class="skip-link" href="#main-content">跳到正文</a>
  <div class="page">
    <header class="header">
      <div class="header-title">
        <div class="header-heading">
          <h1>Claude Code 中文速查表</h1>
          <div class="header-heading-actions">
            <a class="github-star-link" href="https://github.com/AceCandy/cc-quick" target="_blank" rel="noreferrer noopener" aria-label="在 GitHub 上为 cc-quick 点 Star">
              <svg width="12" height="12" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><path d="M8 0.2a8 8 0 0 0-2.53 15.59c0.4 0.08 0.55-0.17 0.55-0.38l-0.01-1.49c-2.25 0.49-2.72-0.96-2.72-0.96-0.36-0.93-0.9-1.18-0.9-1.18-0.74-0.5 0.06-0.49 0.06-0.49 0.81 0.06 1.24 0.84 1.24 0.84 0.72 1.24 1.89 0.88 2.35 0.67 0.07-0.52 0.28-0.88 0.51-1.08-1.79-0.2-3.68-0.9-3.68-3.99 0-0.88 0.31-1.6 0.83-2.16-0.08-0.2-0.36-1.03 0.08-2.13 0 0 0.68-0.22 2.22 0.82A7.7 7.7 0 0 1 8 3.49c0.68 0 1.36 0.09 2 0.27 1.54-1.04 2.22-0.82 2.22-0.82 0.44 1.1 0.16 1.93 0.08 2.13 0.52 0.56 0.83 1.28 0.83 2.16 0 3.1-1.89 3.78-3.69 3.98 0.29 0.25 0.55 0.74 0.55 1.5l-0.01 2.7c0 0.21 0.14 0.46 0.56 0.38A8 8 0 0 0 8 0.2Z"/></svg>
              <span>GitHub Star</span>
            </a>
            <div class="header-counter" aria-live="polite">
              <span class="header-counter-label">本站访问量</span>
              <span id="siteVisitCount" class="visit-count" data-counter-namespace="cc-quick" data-counter-name="site-visits">—</span>
            </div>
          </div>
        </div>
        <button class="changelog-trigger" type="button" aria-controls="changelogPanel" aria-expanded="false">
          最近变更
        </button>
      </div>
      <div class="header-right">
        <div class="header-controls">
          <div class="theme-toggle" id="themeToggle" aria-label="主题切换">
            <button class="theme-btn active" type="button" data-theme="light" aria-label="切换到浅色主题">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/></svg>
            </button>
            <button class="theme-btn" type="button" data-theme="dark" aria-label="切换到深色主题">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg>
            </button>
          </div>
        </div>
        <div class="header-meta">
          <span class="version-info">{{VERSION_HTML}}</span>
          <span class="last-updated">{{LAST_UPDATED}}</span>
        </div>
      </div>
      <div class="changelog-panel" id="changelogPanel" hidden>
        <ul class="changelog-list">
          {{CHANGELOG_ITEMS}}
        </ul>
      </div>
    </header>

    <div class="page-shell">
      <main id="main-content" class="page-content">
        <div class="main-grid">
          {{SECTIONS_HTML}}
        </div>
      </main>

      <aside class="page-sidebar">
        {{SECTION_SWITCHER_HTML}}
      </aside>
    </div>

    <section class="appendix" aria-labelledby="appendix-title">
      <header class="appendix-header">
        <h2 class="appendix-title" id="appendix-title">补充参考</h2>
      </header>
      <footer class="footer">
        {{FOOTER_HTML}}
        <div class="footer-row">
          <span class="footer-item">页面由上游内容自动同步生成；未命中词表时默认保留原文。</span>
        </div>
      </footer>
    </section>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/counterapi@2.1.2/dist/counter.browser.min.js" defer></script>
  <script src="./script.js" defer></script>
</body>
</html>
